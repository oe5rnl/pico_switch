[platformio]
default_envs = cyd

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600

lib_deps =
	lvgl/lvgl@^8.3.0
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-I "${PROJECT_DIR}"
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT=0

build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>
	-<serial_loopback_test.cpp>

[env:cyd]
build_flags =
	${env.build_flags}
	-DILI9341_2_DRIVER
	-DTFT_INVERSION_ON

[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DST7789_DRIVER
	-DTFT_INVERSION_OFF

; Standalone UART0-Loopback-Test (nur serial_loopback_test.cpp)
; Anzeige des Ergebnisses auf dem Display, Test von TXD0/RXD0 (GPIO1/GPIO3).
; Flash:  pio run -e loopback -t upload
[env:loopback]
build_flags =
	${env.build_flags}
	-DILI9341_2_DRIVER
	-DTFT_INVERSION_ON
build_src_filter =
	+<serial_loopback_test.cpp>
